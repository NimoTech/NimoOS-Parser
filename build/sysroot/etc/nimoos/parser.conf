[common]
RuntimePath = /var/run/nimoos
DataPath = /var/lib/nimoos/parser
LogPath = /var/log/nimoos

[parser]
QdrantUrl = http://127.0.0.1:6333
QdrantGrpcPort = 6334
WikiPollIntervalSec = 2
WikiPollLimit = 200
JobLeaseSec = 300
# Text files above this many bytes are recorded but their content is not indexed.
MaxFileBytes = 16777216
WorkerTextConcurrency = 2
TombstoneGraceHours = 24
GcIntervalSec = 21600
BindHost = 127.0.0.1
BindPort = 8283
WikiDiscoveryPath = /var/run/nimoos/wiki.url
